name: Security Scan

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Scans for hardcoded secrets and API keys using the community action
      - name: Run Gitleaks
        uses: gacts/gitleaks@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 2. scans C++, JavaScript, Python, and web code for vulnerabilities
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

      # 3. scans filesystem, malware indicators, and third-party dependencies
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
