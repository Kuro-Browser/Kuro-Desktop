name: Bug Report
description: File a bug report
title: "[Bug]: "
labels:
  - "type:bug"

body:
  - type: markdown
    attributes:
      value: |
        <p align="center">

        </p>

        <p align="center"><em>Thanks for helping us improve Kuro Browser!</em></p>

        > [!IMPORTANT]
        > - Please provide a descriptive title.
        > - Please search existing issues before creating a new one.
        > - Enhancement requests should be submitted through GitHub Discussions.
        > - Please fill out the template to the best of your ability.
        > - Include clear reproduction steps and screenshots or videos when possible.

  - type: checkboxes
    id: preliminary-checks
    attributes:
      label: Preliminary Checks
      description: Please confirm the following before submitting a bug report.
      options:
        - label: I have read and understood the important section above.
          required: true
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I am not filing an enhancement request.
          required: true
        - label: I have confirmed that this issue is related to Kuro Browser.
          required: true
        - label: I have removed my Mods, custom CSS, themes, and extensions where applicable.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly and concisely.
      placeholder: Tell us what you see.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect Kuro Browser to do?
      placeholder: Tell us what should have happened.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What did Kuro Browser actually do?
      placeholder: Tell us what actually happened.
    validations:
      required: true

  - type: textarea
    id: how-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Provide numbered steps so developers can reproduce the issue.
      placeholder: |
        1. Open Kuro Browser
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots and videos
      description: If applicable, add screenshots or videos to help explain the issue.

  - type: input
    id: version
    attributes:
      label: Kuro Version
      description: What version of Kuro Browser are you running? Please do not use "latest" or "newest".
      placeholder: "0.1.0-beta.1"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: What platform are you seeing the problem on?
      multiple: true
      options:
        - Windows - x64
        - Windows - ARM64
        - Other
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: What component is this issue related to?
      options:
        - Other
        - Tabs
        - Tab unloading
        - Tab Groups
        - Workspaces
        - Split View
        - Bookmarks
        - History
        - URL Bar
        - Search
        - Downloads
        - Extensions
        - Themes
        - Custom CSS
        - Settings
        - UI
        - Performance
        - RAM Saver
        - Privacy
        - Security
        - Sync
        - Updates
        - Media
        - Keyboard Shortcuts
        - Accessibility
        - AI
        - Local AI
        - Cloud AI
        - Ollama
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: If applicable, paste any relevant logs or error messages.
      render: shell
